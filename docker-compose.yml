services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=sqlite:///./users.db
      - LOG_LEVEL=INFO
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

  test:
    build: .
    environment:
      - DATABASE_URL=sqlite:///./test.db
      - LOG_LEVEL=ERROR
      - RATE_LIMIT_ENABLED=false
    command: pytest -v --cov=app --cov-report=term-missing --ignore=tests/test_rate_limiting.py

  test-rate-limit:
    build: .
    environment:
      - DATABASE_URL=sqlite:///./test_ratelimit.db
      - LOG_LEVEL=ERROR
      - RATE_LIMIT_ENABLED=true
    command: pytest -v tests/test_rate_limiting.py
