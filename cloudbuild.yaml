steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/user-management-api:$SHORT_SHA"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "run-tests"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker run --rm \
          gcr.io/$PROJECT_ID/user-management-api:$SHORT_SHA \
          pytest -v --cov=app --cov-report=term-missing

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-to-cloud-run"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud run deploy user-management-api \
          --image gcr.io/$PROJECT_ID/user-management-api:$SHORT_SHA \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --memory 512Mi \
          --cpu 1 \
          --service-account $_SA_NAME@$PROJECT_ID.iam.gserviceaccount.com \
          --add-cloudsql-instances $PROJECT_ID:$_REGION:$_CLOUDSQL_INSTANCE \
          --set-secrets DATABASE_URL=$_DATABASE_URL_SECRET:latest \
          --set-env-vars LOG_LEVEL=INFO

images:
  - "gcr.io/$PROJECT_ID/user-management-api:$SHORT_SHA"

timeout: "1800s"

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
  _SA_NAME: user-api-cloud-run
  _CLOUDSQL_INSTANCE: user-management-db
  _DATABASE_URL_SECRET: database-url
