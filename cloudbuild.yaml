steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/user-management-api:$SHORT_SHA"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "run-tests"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker run --rm gcr.io/$PROJECT_ID/user-management-api:$SHORT_SHA \
          pytest -v --cov=app --cov-report=term-missing

  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/user-management-api:$SHORT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-to-cloud-run"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud run deploy user-management-api \
          --image gcr.io/$PROJECT_ID/user-management-api:$SHORT_SHA \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated \
          --memory 512Mi \
          --cpu 1 \
          --set-env-vars DATABASE_URL=$$DATABASE_URL,LOG_LEVEL=INFO

images:
  - "gcr.io/$PROJECT_ID/user-management-api:$SHORT_SHA"

timeout: "1800s"

options:
  logging: CLOUD_LOGGING_ONLY
