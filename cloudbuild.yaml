steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      - "build"
      - "-t"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/user-management-api:$SHORT_SHA"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "run-tests"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker run --rm -e RATE_LIMIT_ENABLED=false \
          $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/user-management-api:$SHORT_SHA \
          pytest -v --cov=app --cov-report=term-missing --ignore=tests/test_rate_limiting.py
        docker run --rm -e RATE_LIMIT_ENABLED=true \
          $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/user-management-api:$SHORT_SHA \
          pytest -v tests/test_rate_limiting.py

  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker push $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/user-management-api:$SHORT_SHA

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-to-cloud-run"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud run deploy user-management-api \
          --image $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/user-management-api:$SHORT_SHA \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --memory 512Mi \
          --cpu 1 \
          --service-account "user-api-cloud-run@$PROJECT_ID.iam.gserviceaccount.com" \
          --add-cloudsql-instances $PROJECT_ID:$_REGION:$_CLOUDSQL_INSTANCE \
          --set-secrets DATABASE_URL=$_DATABASE_URL_SECRET:latest \
          --set-env-vars LOG_LEVEL=INFO

images:
  - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/user-management-api:$SHORT_SHA"

timeout: "1800s"

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
  _ARTIFACT_REGISTRY_REPO: user-management-api
  _CLOUDSQL_INSTANCE: user-management-db
  _DATABASE_URL_SECRET: database-url
